name: Perps simulado

# Ejecuta el bot de copia de perpetuos (Hyperliquid) en modo SIMULADO (no toca dinero) en tandas de ~5 h 40 min,
# guarda perps/bot (datos) en la rama `perps-datos` cada 10 min y se relanza solo.
# A partir de la fecha HASTA se detiene y se desactiva solo (deja de dispararse cada 30 min).
# Para pararlo antes: Actions -> Perps simulado -> "..." -> Disable workflow.
# Para una prueba nueva: cambiar HASTA y volver a activarlo (Enable workflow).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["perps/bot/**", ".github/workflows/perps-simulado.yml"]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: perps-simulado
  cancel-in-progress: false

env:
  HASTA: "2026-12-08T00:00:00Z"

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: ¿Sigue dentro del plazo?
        id: plazo
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d "$HASTA" +%s)" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: Fuera de plazo, desactivar el flujo
        if: steps.plazo.outputs.ok != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable perps-simulado.yml --repo "$GITHUB_REPOSITORY"
      - uses: actions/checkout@v4
        if: steps.plazo.outputs.ok == '1'
      - uses: actions/setup-python@v5
        if: steps.plazo.outputs.ok == '1'
        with:
          python-version: "3.12"
      - name: Ejecutar en simulado
        if: steps.plazo.outputs.ok == '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          pip install -q aiohttp websockets
          git config user.name "copybot"; git config user.email "copybot@users.noreply.github.com"
          if git fetch -q origin perps-datos; then git worktree add -q _datos origin/perps-datos && git -C _datos checkout -q -B perps-datos
          else git worktree add -q --detach _datos && git -C _datos checkout -q --orphan perps-datos && git -C _datos rm -rfq . ; fi
          guardar() { (cd _datos && git add -A && { git diff --cached --quiet || { git commit -qm "perps $(date -u +'%F %H:%M')" && git push -q origin perps-datos; }; }) || true; }
          (while true; do sleep 600; guardar; done) &
          mkdir -p _datos/v1 && cd perps/bot && timeout 340m python -u bot.py config.json ../../_datos/v1 | tee -a ../../_datos/v1/bot.log || true
          cd ../.. && guardar
      - name: Relanzar
        if: always() && steps.plazo.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run perps-simulado.yml --ref main --repo "$GITHUB_REPOSITORY"
